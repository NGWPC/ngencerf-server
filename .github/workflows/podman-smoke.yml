# .github/workflows/podman-smoke.yml
# ADDITIVE WORKFLOW: Proves Podman build and smoke verification for ngencerf-server.
# Leaves existing .github/workflows/cicd.yml and release paths untouched.

name: Podman Build & Smoke (Additive)

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push test tags (:podman-test) to GHCR"
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - development
    paths:
      - '.github/workflows/podman-smoke.yml'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'runCerf.sh'
      - 'manage.py'
      - 'cerfServer/**'
      - 'calibration/**'
      - 'gunicorn_conf.py'
      - 'compose.yaml'

permissions:
  contents: read
  packages: write

jobs:
  podman-build-smoke:
    name: Podman Build & Smoke (Cerf Server)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Preinstalled Podman Environment
        run: |
          podman version
          podman info --format 'OS: {{.Host.Distribution.Distribution}} {{.Host.Distribution.Version}} | Storage: {{.Store.GraphDriverName}}'

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build Server Image with Podman (Docker Format)
        id: build
        run: |
          set -euo pipefail
          ulimit -n 65535 || true
          IMAGE_TAG="localhost/ngencerf-server:podman-test"

          echo "Building ${IMAGE_TAG} using Dockerfile with --format docker..."
          podman build \
            --ulimit nofile=65535:65535 \
            --format docker \
            -f Dockerfile \
            -t "${IMAGE_TAG}" \
            .

          echo "IMAGE_LOCAL=${IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: Smoke Probe 1 - Entrypoint runCerf.sh & Django CLI Check
        run: |
          set -euo pipefail
          echo "Verifying runCerf.sh entrypoint help..."
          podman run --rm "${IMAGE_LOCAL}" --help
          echo "Verifying manage.py CLI dispatch via runCerf.sh..."
          podman run --rm "${IMAGE_LOCAL}" manage --help
          echo "Probe 1 Passed: runCerf.sh and manage.py CLI options executable."

      - name: Smoke Probe 2 - Python Environment & Dependencies Import
        run: |
          set -euo pipefail
          echo "Verifying Python version and core server packages..."
          podman run --rm --entrypoint python "${IMAGE_LOCAL}" --version
          podman run --rm --entrypoint python "${IMAGE_LOCAL}" \
            -c "import django, cerfServer, mswm, data_assimilation_engine, ewts; print('Probe 2 Passed: Django, cerfServer, mswm, data_assimilation_engine, and ewts imported successfully.')"
          podman run --rm --entrypoint python "${IMAGE_LOCAL}" \
            -c "from cerfServer.settings import CONTAINER_CLI, DOCKER_RUNTIME_INFO; print(f'Probe 2b Passed: Container engine dynamically resolved to: {CONTAINER_CLI}'); assert 'calibration' in DOCKER_RUNTIME_INFO"

      - name: Smoke Probe 3 - Git Provenance & Prebuilt Templates Check
        run: |
          set -euo pipefail
          echo "Verifying server git provenance file..."
          podman run --rm --entrypoint cat "${IMAGE_LOCAL}" /ngencerf/ngencerf-server/ngencerf-server_git_info.json
          podman run --rm --entrypoint test "${IMAGE_LOCAL}" -s /ngencerf/ngencerf-server/ngencerf-server_git_info.json

          echo "Verifying prebuilt BMI forcing templates directory..."
          podman run --rm --entrypoint test "${IMAGE_LOCAL}" -d /ngencerf/prebuilt/bmi_forcing_templates
          echo "Probe 3 Passed: Provenance file and prebuilt templates verified."

      - name: Inspect Built OCI Image
        run: |
          podman image inspect "${IMAGE_LOCAL}" \
            --format 'Image ID: {{.Id}} | Digest: {{.Digest}} | Entrypoint: {{.Config.Entrypoint}} | Cmd: {{.Config.Cmd}}'

      - name: Optional GHCR Push (:podman-test only)
        if: ${{ inputs.push_images }}
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DEST_BASE="ghcr.io/${REPO_LOWER}"
          TAG_TEST="${DEST_BASE}:podman-test"
          TAG_SHA="${DEST_BASE}:${{ github.sha }}-podman-test"

          echo "Publishing test verification tags..."
          podman tag "${IMAGE_LOCAL}" "${TAG_TEST}"
          podman tag "${IMAGE_LOCAL}" "${TAG_SHA}"

          podman push "${TAG_TEST}"
          podman push "${TAG_SHA}"

          echo "Pushed ${TAG_TEST} and ${TAG_SHA}"
          echo "NOTICE: Production aliases (:latest, branch tags) remain untouched."
