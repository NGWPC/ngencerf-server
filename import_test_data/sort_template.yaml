# ─────────────────────────────
# Calibration Job Sorting Template
# ─────────────────────────────
# Leave blank for default sorting (descending by job ID).
# The backend will use "-id" if no sort is provided.
#
# Valid field options (case-sensitive):
#   gage_id
#   user_formulation_name
#   submit_date
#   created_at
#   job_genesis
#   status
#   calibration_start_period
#   calibration_end_period
#   stop_criteria
#
# Valid direction values:
#   asc   → ascending order
#   desc  → descending order
#
# Examples:
#   field: submit_date
#   direction: desc
#
#   field: gage_id
#   direction: asc

field: ""        # One of the valid field names listed above
direction: ""    # "asc" or "desc"
