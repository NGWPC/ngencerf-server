#This file is used for development testing only
#compose files are not used for production

name: ngencerf-server

services:
  redis:
    image: redis:7.2
    container_name: ngencerf-redis
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - ./redis/redis.conf.prod:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: no  # ensure Redis is recreated fresh on each deploy; no auto-restart
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 5s

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    # Host path is a variable like the server's mounts; the default keeps the
    # historical ../data/db next to this repo.
    volumes:
      - ${POSTGRES_DATA_PATH:-../data/db}:/var/lib/postgresql/data
    # Throwaway dev creds; overridable via shell env if ever needed.
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      retries: 5
      timeout: 5s

  ngencerf-services:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      args:
        - DATA_ASSIMILATION_REF=${DATA_ASSIMILATION_REF:-development}
        - EWTS_REF=${EWTS_REF:-development}
        - MSW_MGR_REF=${MSW_MGR_REF:-development}
        - NGEN_FORCING_REF=${NGEN_FORCING_REF:-development}
        # Per-dependency cache-bust. Default 1 (no busting). Override with the
        # dependency's HEAD to force a fresh install, e.g.:
        #   EWTS_CACHE_BUST=$(git ls-remote https://github.com/NGWPC/nwm-ewts.git development | awk '{print $1}')
        - DATA_ASSIMILATION_CACHE_BUST=${DATA_ASSIMILATION_CACHE_BUST:-1}
        - EWTS_CACHE_BUST=${EWTS_CACHE_BUST:-1}
        - MSW_MGR_CACHE_BUST=${MSW_MGR_CACHE_BUST:-1}
        - NGEN_FORCING_CACHE_BUST=${NGEN_FORCING_CACHE_BUST:-1}
    image: ghcr.io/ngwpc/ngencerf-server:${NGENCERF_SERVER_TAG:-latest}
    pull_policy: build
    ports:
      - "8000:8000"
    # Every host-side path is a variable so this file assumes no particular
    # host layout; the defaults keep the historical sibling directories
    # (../data and ../logs next to this repo) and the README's /ngencerf/data
    # symlink. The container side of the data mount follows
    # CONTAINER_DATA_ROOT, the same setting the server reads. See
    # Readme_portable_deployment.md for running without bind mounts.
    volumes:
      - ${NGENCERF_INIT_PATH:-../data/.ngencerf-init}:/ngencerf/ngencerf-server/.init/
      - ${NGEN_CAL_DATA_PATH:-/ngencerf/data/}:${CONTAINER_DATA_ROOT:-/ngencerf/data}/
      - ${NGENCERF_LOGS_PATH:-../logs/ngencerf-server}:/ngencerf/ngencerf-server/logs/
    # NGEN_CAL_DATA_PATH is handed to the server as HOST_DATA_ROOT (the name
    # settings.py reads) so DOCKER-mode job containers bind the real host
    # directory rather than the container-side path; CONTAINER_DATA_ROOT is
    # passed so the server and the mount above agree. DB creds default to the
    # throwaway dev postgres/postgres.
    environment:
      - HOST_DATA_ROOT=${NGEN_CAL_DATA_PATH:-/ngencerf/data/}
      - CONTAINER_DATA_ROOT=${CONTAINER_DATA_ROOT:-/ngencerf/data}
      - CERF_SERVER_DATABASE_NAME=${POSTGRES_DB:-postgres}
      - CERF_SERVER_DATABASE_USER=${POSTGRES_USER:-postgres}
      - CERF_SERVER_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    env_file:
      - path: cerfServer/.env-docker-dev
        required: true
      - path: cerfServer/.env-override
        required: false

